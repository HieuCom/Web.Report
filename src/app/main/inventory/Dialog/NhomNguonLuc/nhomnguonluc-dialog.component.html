<h1>Nhóm Nguồn Lực</h1>
<div class="search-box">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterDanhSachNhomNguonLuc()"
    placeholder="Tìm kiếm theo tên nhóm nguồn lực..."
    class="form-control"
  />
</div>
<div class="table-responsive">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th *ngFor="let colInfo of columnInfonhapnhomNguonLuc">
          <div>
            {{ colInfo.Caption }}
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let nhomNguonLuc of danhSachNhomNguonLuc"
        (click)="chonNhomNguonLuc(nhomNguonLuc.ID_NHOM_NL)"
        class="select-item"
      >
        <td *ngFor="let colInfo of columnInfonhapnhomNguonLuc">
          <strong *ngIf="nhomNguonLuc.BOLD == true && colInfo.Format == 'd'">{{
            nhomNguonLuc[colInfo.Name] | date: "dd/MM/yyyy"
          }}</strong>
          <span *ngIf="nhomNguonLuc.BOLD != true && colInfo.Format == 'd'">{{
            nhomNguonLuc[colInfo.Name] | date: "dd/MM/yyyy"
          }}</span>

          <strong
            *ngIf="
              nhomNguonLuc.BOLD == true &&
              colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ nhomNguonLuc[colInfo.Name] | number }}</strong
          >
          <span
            *ngIf="
              nhomNguonLuc.BOLD != true &&
              colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ nhomNguonLuc[colInfo.Name] | number }}</span
          >

          <strong *ngIf="nhomNguonLuc.BOLD == true && colInfo.Format == ''">{{
            nhomNguonLuc[colInfo.Name]
          }}</strong>
          <span *ngIf="nhomNguonLuc.BOLD != true && colInfo.Format == ''">{{
            nhomNguonLuc[colInfo.Name]
          }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
