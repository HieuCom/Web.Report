<h1>Vụ việc</h1>
<div class="search-box">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterDanhSachVuViec()"
    placeholder="Tìm kiếm theo tên vụ việc..."
    class="form-control"
  />
</div>
<div class="table-responsive">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th *ngFor="let colInfo of columnInfonhapvuViec">
          <div>
            {{ colInfo.Caption }}
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let vuViec of danhSachVuViec"
        (click)="chonVuViec(vuViec.ID_VV)"
        class="select-item"
      >
        <td *ngFor="let colInfo of columnInfonhapvuViec">
          <strong *ngIf="vuViec.BOLD == true && colInfo.Format == 'd'">{{
            vuViec[colInfo.Name] | date: "dd/MM/yyyy"
          }}</strong>
          <span *ngIf="vuViec.BOLD != true && colInfo.Format == 'd'">{{
            vuViec[colInfo.Name] | date: "dd/MM/yyyy"
          }}</span>

          <strong
            *ngIf="
              vuViec.BOLD == true && colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ vuViec[colInfo.Name] | number }}</strong
          >
          <span
            *ngIf="
              vuViec.BOLD != true && colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ vuViec[colInfo.Name] | number }}</span
          >

          <strong *ngIf="vuViec.BOLD == true && colInfo.Format == ''">{{
            vuViec[colInfo.Name]
          }}</strong>
          <span *ngIf="vuViec.BOLD != true && colInfo.Format == ''">{{
            vuViec[colInfo.Name]
          }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
