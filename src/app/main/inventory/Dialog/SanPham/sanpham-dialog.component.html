<h1>San Phẩm</h1>
<div class="search-box">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterDanhSachSanPham()"
    placeholder="Tìm kiếm theo tên sản phẩm..."
    class="form-control"
  />
</div>
<div class="table-responsive">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th *ngFor="let colInfo of columnInfonhapsanPham">
          <div>
            {{ colInfo.Caption }}
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let sanPham of danhSachSanPham"
        (click)="chonSanPham(sanPham.ID_SP)"
        class="select-item"
      >
        <td *ngFor="let colInfo of columnInfonhapsanPham">
          <strong *ngIf="sanPham.BOLD == true && colInfo.Format == 'd'">{{
            sanPham[colInfo.Name] | date: "dd/MM/yyyy"
          }}</strong>
          <span *ngIf="sanPham.BOLD != true && colInfo.Format == 'd'">{{
            sanPham[colInfo.Name] | date: "dd/MM/yyyy"
          }}</span>

          <strong
            *ngIf="
              sanPham.BOLD == true && colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ sanPham[colInfo.Name] | number }}</strong
          >
          <span
            *ngIf="
              sanPham.BOLD != true && colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ sanPham[colInfo.Name] | number }}</span
          >

          <strong *ngIf="sanPham.BOLD == true && colInfo.Format == ''">{{
            sanPham[colInfo.Name]
          }}</strong>
          <span *ngIf="sanPham.BOLD != true && colInfo.Format == ''">{{
            sanPham[colInfo.Name]
          }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
