<h1>Nhóm Sản Phẩm</h1>
<div class="search-box">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterDanhSachNhomSanPham()"
    placeholder="Tìm kiếm theo tên nhóm sản phẩm..."
    class="form-control"
  />
</div>
<div class="table-responsive">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th *ngFor="let colInfo of columnInfonhapnhomSanPham">
          <div>
            {{ colInfo.Caption }}
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let nhomSanPham of danhSachNhomSanPham"
        (click)="chonNhomSanPham(nhomSanPham.ID_NHOM_SP)"
        class="select-item"
      >
        <td *ngFor="let colInfo of columnInfonhapnhomSanPham">
          <strong *ngIf="nhomSanPham.BOLD == true && colInfo.Format == 'd'">{{
            nhomSanPham[colInfo.Name] | date: "dd/MM/yyyy"
          }}</strong>
          <span *ngIf="nhomSanPham.BOLD != true && colInfo.Format == 'd'">{{
            nhomSanPham[colInfo.Name] | date: "dd/MM/yyyy"
          }}</span>

          <strong
            *ngIf="
              nhomSanPham.BOLD == true &&
              colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ nhomSanPham[colInfo.Name] | number }}</strong
          >
          <span
            *ngIf="
              nhomSanPham.BOLD != true &&
              colInfo.Format == '#,##0.##;(#,##0.##);#'
            "
            >{{ nhomSanPham[colInfo.Name] | number }}</span
          >

          <strong *ngIf="nhomSanPham.BOLD == true && colInfo.Format == ''">{{
            nhomSanPham[colInfo.Name]
          }}</strong>
          <span *ngIf="nhomSanPham.BOLD != true && colInfo.Format == ''">{{
            nhomSanPham[colInfo.Name]
          }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
